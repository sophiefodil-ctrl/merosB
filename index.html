<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Μέρος Β</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2f6b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#16232b;--purple:#4a2f6b;--marble:#f0edf6;--paper:#faf9fd;
    --olive:#6b7a4a;--clay:#a34b32;--saffron:#c98a12;--line:rgba(22,35,43,.14);--r:14px;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--marble);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .brand{font-family:var(--serif);font-weight:700;font-size:17px}
  .brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;opacity:.55;margin-top:1px}
  .hbtns{display:flex;gap:5px}
  .iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 11px;
    font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .iconbtn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
  .piles{display:flex;gap:4px;padding:8px 10px 0}
  .pile{flex:1;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px;
    padding:5px 5px;background:var(--paper);border:1px solid var(--line)}
  .pile b{display:block;font-family:var(--serif);font-size:16px;line-height:1.1}
  .pile span{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.6}
  .pile.k{border-bottom:3px solid var(--olive)}
  .pile.l{border-bottom:3px solid var(--purple)}
  .pile.h{border-bottom:3px solid var(--clay)}
  .pile.s{border-bottom:3px solid var(--saffron)}
  .pile[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .pile[aria-pressed="true"] span{opacity:.8}
  .themebar{padding:6px 10px 0;display:flex;align-items:center;gap:8px;font-size:12px}
  .themebadge{background:var(--purple);color:#fff;border-radius:999px;padding:3px 11px;
    font-size:12px;cursor:pointer}
  .themetap{opacity:.6;cursor:pointer;text-decoration:underline;font-size:12px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:10px 14px 4px;min-height:0;overflow:auto}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 0 rgba(22,35,43,.06),0 10px 28px -22px rgba(22,35,43,.9);
    padding:20px 18px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--purple)}
  .card.hard::before{background:var(--clay)}
  .card.spelling::before{background:var(--saffron)}
  .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:8px}
  .taskbox{background:var(--marble);border-radius:10px;padding:10px 13px;margin-bottom:12px;
    font-size:14px;line-height:1.5;color:var(--ink);opacity:.9}
  .prompt{font-family:var(--serif);font-size:18px;color:var(--purple);line-height:1.4;word-break:break-word}
  .rule{height:1px;background:var(--line);margin:14px -18px 12px}
  .answer{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.45;word-break:break-word}
  .tapline{margin-top:16px;font-size:12px;opacity:.5;text-align:center}
  .reveal{width:100%;margin-top:12px;padding:15px;border:none;border-radius:var(--r);
    background:var(--ink);color:var(--paper);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
  .grade button{padding:13px 5px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);
    font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.2}
  .grade button small{display:block;font-weight:400;font-size:10px;opacity:.6;margin-top:2px}
  .g1{border-bottom:3px solid var(--olive)} .g2{border-bottom:3px solid var(--purple)}
  .g3{border-bottom:3px solid var(--clay)} .g4{border-bottom:3px solid var(--saffron)}
  .dropline{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  .dropline .act{padding:11px 5px;border-radius:var(--r);border:1px solid var(--line);
    background:transparent;font:inherit;font-size:12.5px;color:var(--ink);opacity:.85;cursor:pointer}
  .dropline .act.danger{color:var(--clay)}
  footer{padding:6px 14px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  footer button{background:none;border:none;font:inherit;font-size:12px;color:var(--ink);
    opacity:.6;text-decoration:underline;cursor:pointer;padding:5px}
  /* panels */
  .panel{position:fixed;inset:0;background:var(--marble);z-index:20;display:flex;flex-direction:column;
    padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto}
  .panel h2{font-family:var(--serif);font-size:19px;margin:0}
  .panel p{font-size:13px;line-height:1.5;opacity:.75;margin:6px 0 10px}
  .phead{position:sticky;top:-16px;z-index:5;background:var(--marble);margin:-16px -16px 0;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid var(--line)}
  .phead .close{background:var(--ink);color:var(--paper);border:none;border-radius:999px;
    padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  input[type=text],textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);
    border-radius:10px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  input[type=search]{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);
    border-radius:10px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
  label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:10px;display:block}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row button{flex:1;min-width:110px;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .row button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .list{margin-top:10px;border-top:1px solid var(--line)}
  .list div{display:flex;align-items:center;gap:7px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .list .g{font-family:var(--serif);color:var(--purple);flex:1;line-height:1.3}
  .list .tt{font-size:10.5px;opacity:.55;white-space:nowrap}
  .list .th{font-size:10.5px;opacity:.55;white-space:nowrap}
  .list .x{background:none;border:none;color:var(--clay);font-size:16px;cursor:pointer;padding:2px 5px}
  .list .pen{color:#1f5f6b}
  .tabs{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:60px;padding:8px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);font:inherit;font-size:11.5px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  /* θέμα picker */
  .thgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
  .thbtn{padding:10px 2px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    font:inherit;font-size:13px;cursor:pointer;text-align:center}
  .thbtn[aria-selected="true"]{background:var(--purple);color:#fff;border-color:var(--purple)}
  .thbtn.has-hard{border-bottom:3px solid var(--clay)}
  .thbtn.has-spell{border-bottom:3px solid var(--saffron)}
  .thbtn.all-known{border-bottom:3px solid var(--olive)}
  .empty{text-align:center;padding:30px 10px;opacity:.6;font-size:13.5px;line-height:1.6}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--paper);
    padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">Μέρος Β<small id="tot">loading…</small></div>
  <div class="hbtns">
    <button class="iconbtn" id="btnTheme">θέμα</button>
    <button class="iconbtn" id="btnWords">Cards</button>
    <button class="iconbtn" id="btnAdd">Add</button>
  </div>
</header>
<div class="piles">
  <button class="pile l" id="fLive"><b id="cLive">0</b><span>Live</span></button>
  <button class="pile h" id="fHard"><b id="cHard">0</b><span>Important</span></button>
  <button class="pile s" id="fSpell"><b id="cSpell">0</b><span>Spelling</span></button>
  <button class="pile k" id="fKnown"><b id="cKnown">0</b><span>Known</span></button>
</div>
<div class="themebar" id="themebar" style="display:none">
  <span>Practising</span>
  <span class="themebadge" id="thbadge" onclick="openThemePicker()"></span>
  <span class="themetap" onclick="clearTheme()">clear filter</span>
</div>
<main><div id="stage"></div></main>
<footer>
  <button id="btnShuffle">Reshuffle</button>
  <button id="btnRestore">Bring back known</button>
</footer>
<div class="toast" id="toast"></div>
<script>
const SEED = [{"p": "κρατήστε", "tt": "πάντα ...", "a": "να κρατάτε", "th": 1}, {"p": "Αν ακολουθείτε τις συμβουλές αυτές, θα είστε σίγουροι", "tt": "Αν είχατε ακολουθήσει τις συμβουλές αυτές, ... σίγουροι για την ασφάλεια", "a": "θα ήσασταν", "th": 1}, {"p": "διευρύνει τη δυνατότητα", "tt": "passive", "a": "Διευρύνεται", "th": 1}, {"p": "για να πραγματοποιήσετε τις αγορές σας", "tt": "noun", "a": "Πραγματοποίηση", "th": 1}, {"p": "Κρατάτε μυστικούς τους κωδικούς", "tt": "Οι κωδικοί εισόδου πρέπει ... μυστικοί.", "a": "να κρατούνται", "th": 1}, {"p": "μπορείτε να είστε", "tt": "... να είσαι", "a": "Μπορείς", "th": 1}, {"p": "Γι' αυτό", "tt": "ίδιο νόημα", "a": "Συνεπώς", "th": 1}, {"p": "σε περίπτωση που", "tt": "ίδιο νόημα", "a": "αν", "th": 1}, {"p": "εγγυάται", "tt": "ίδιο νόημα", "a": "διασφαλίζει", "th": 1}, {"p": "Ο θείος μου, για λόγους υγείας, είχε κλειστό το μαγαζί του.", "tt": "Ο θείος μου, επειδή ... ,είχε κλειστό το μαγαζί του.", "a": "είχε προβλήματα υγείας/ήταν άρρωστος", "th": 2}, {"p": "Ο Δημήτρης, ανέκαθεν , μοίραζε το φαγητό που περίσσευε σε συμπολίτες του.", "tt": "Ο Δημήτρης, την προηγούμενη Κυριακή, ... το φαγητό που ... σε συμπολίτες του.", "a": "μοίρασε...περίσσεψε", "th": 2}, {"p": "Όμως, και 20 χρόνια μετά, μάγειρας νιώθω, όχι τόσο επιχειρηματίας.", "tt": "Όμως, και 20 χρόνια μετά νιώθω περισσότερο μάγειρας... επιχειρηματίας.", "a": "παρά", "th": 2}, {"p": "Ήμουν 20 ετών, όταν ανέλαβα το μαγαζί από τον θείο μου.", "tt": "Σε ηλικία 20 ετών ... το μαγαζί από τον θείο του.", "a": "ανέλαβε", "th": 2}, {"p": "Όταν άρχισε να μοιράζει δωρεάν φαγητό, δεν μπορούσε να το πιστέψει", "tt": "Αν δεν είχα αρχίσει να μοιράζω δωρεάν φαγητό, δεν ... να το πιστέψω", "a": "θα μπορούσα", "th": 2}, {"p": "Στην πρόταση «άρχισε ο κόσμος να βοηθάει με σακούλες γεμάτες με προμήθειες» η φράση «να βοηθάει» σημαίνει", "tt": "σημαίνει", "a": "να συμβάλλει", "th": 2}, {"p": "Στη φράση «Ο Δημήτρης αγοράζει με δικά του έξοδα την πρώτη ύλη, για να φτιάξει μαγειρευτό φαγητό» const KEY = "merosB-v2";
let S = {cards:[], removed:[]};
let current=null, revealed=false, queue=[], focus=null, themeFilter=null;

const uid=()=>Math.random().toString(36).slice(2,9);
function mk(p,tt,a,th){return {id:uid(),prompt:p,taskType:tt,answer:a,theme:th||null,pile:"live",seen:0};}

async function readStore(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value;}}catch(e){}
  try{return localStorage.getItem(KEY);}catch(e){}
  return null;
}
async function save(){
  const v=JSON.stringify(S);
  try{if(window.storage&&window.storage.set){await window.storage.set(KEY,v);return;}}catch(e){}
  try{localStorage.setItem(KEY,v);}catch(e){toast("Could not save");}
}

async function load(){
  const raw=await readStore();
  if(raw){try{S=JSON.parse(raw);}catch(e){}}
  if(!S.cards)S.cards=[];
  if(!S.removed)S.removed=[];
  // merge new seed cards
  const have=new Set(S.cards.map(c=>c.id));
  const removedSet=new Set(S.removed);
  // match seed cards by prompt+theme (stable key)
  const haveKey=new Set(S.cards.map(c=>c.prompt+"|||"+(c.theme||"")));
  let added=0;
  SEED.forEach(sd=>{
    const k=sd.p+"|||"+(sd.th||"");
    if(haveKey.has(k)||removedSet.has(k))return;
    S.cards.push(mk(sd.p,sd.tt,sd.a,sd.th)); haveKey.add(k); added++;
  });
  if(added)await save();
  build(); render();
}

function pool(){
  let p=S.cards;
  if(themeFilter!==null) p=p.filter(c=>c.theme===themeFilter);
  if(focus) p=p.filter(c=>c.pile===focus);
  else p=p.filter(c=>c.pile!=="known");
  return p;
}
function build(){
  let p=pool();
  if(!focus) p=p.concat(p.filter(c=>c.pile==="hard"));
  queue=shuffle(p); current=queue.shift()||null;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function next(){
  if(!queue.length)build(); else current=queue.shift();
  if(current&&!focus&&current.pile==="known")return next();
  revealed=false; render();
}
function setFocus(p){
  focus=(focus===p)?null:p;
  build();revealed=false;render();
  toast(focus?"Practising "+({hard:"important",live:"live",known:"known",spelling:"spelling"}[focus])+" pile only":"Practising all piles");
}
function clearTheme(){themeFilter=null;build();revealed=false;render();toast("Showing all themes");}
function openThemePicker(){
  const p=document.createElement("div");p.className="panel";
  const c={};
  S.cards.forEach(card=>{
    const t=card.theme;if(!t)return;
    if(!c[t])c[t]={live:0,hard:0,spelling:0,known:0};
    if(c[t][card.pile]!==undefined)c[t][card.pile]++;
  });
  const btns=Array.from({length:100},(_,i)=>i+1).map(n=>{
    const st=c[n]||{live:0,hard:0,spelling:0,known:0};
    const total=st.live+st.hard+st.spelling+st.known;
    let cls="thbtn";
    if(total>0&&st.known===total)cls+=" all-known";
    else if(st.hard>0)cls+=" has-hard";
    else if(st.spelling>0)cls+=" has-spell";
    const sel=n===themeFilter?" aria-selected=\"true\"":"";
    return `<button class="${cls}" data-n="${n}"${sel}>${n}</button>`;
  }).join("");
  p.innerHTML=`<div class="phead"><h2>Choose a θέμα</h2><button class="close" id="xth">Close</button></div>
    <p>Tap a number to drill that θέμα. Green underline = all known · red = has important cards · yellow = has spelling cards.</p>
    <div class="thgrid">${btns}</div>
    <div class="row"><button id="allth">All themes</button></div>`;
  document.body.appendChild(p);
  p.querySelector("#xth").onclick=()=>p.remove();
  p.querySelector("#allth").onclick=()=>{themeFilter=null;build();revealed=false;render();p.remove();toast("Showing all themes");};
  p.querySelectorAll(".thbtn").forEach(b=>b.onclick=()=>{
    themeFilter=parseInt(b.dataset.n);build();revealed=false;render();p.remove();
    toast("θέμα "+themeFilter+" — "+pool().length+" cards in current filter");
  });
}

const stage=document.getElementById("stage");
const themebar=document.getElementById("themebar");
stage.addEventListener("click",e=>{
  const b=e.target.closest(".act");if(!b||!current)return;
  if(b.dataset.act==="edit")editCard(current);
  if(b.dataset.act==="delete")drop(current);
});

function counts(){
  let src=S.cards;
  if(themeFilter!==null)src=src.filter(c=>c.theme===themeFilter);
  const c={live:0,hard:0,spelling:0,known:0};
  src.forEach(x=>{if(c[x.pile]!==undefined)c[x.pile]++;});
  cLive.textContent=c.live; cHard.textContent=c.hard; cSpell.textContent=c.spelling; cKnown.textContent=c.known;
  const scope=themeFilter!==null?`θ.${themeFilter} · ${src.length} cards`:S.cards.length+" cards · v2";
  tot.textContent=scope;
  fLive.setAttribute("aria-pressed",focus==="live"); fHard.setAttribute("aria-pressed",focus==="hard");
  fSpell.setAttribute("aria-pressed",focus==="spelling"); fKnown.setAttribute("aria-pressed",focus==="known");
  if(themeFilter!==null){themebar.style.display="flex";thbadge.textContent="θέμα "+themeFilter;}
  else themebar.style.display="none";
}

function esc(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600);}

function render(){
  counts();
  const p=pool();
  if(!current||!p.length){
    const msg=themeFilter!==null&&!S.cards.filter(c=>c.theme===themeFilter).length
      ?"No cards for this θέμα yet."
      :focus?"This pile is empty — tap it again to go back."
      :"Nothing left in the live pile.";
    stage.innerHTML=`<div class="empty">${msg}</div>`;return;
  }
  const pile=current.pile;
  const thTag=current.theme?`<span style="font-size:10px;opacity:.5;margin-left:8px">θέμα ${current.theme}</span>`:"";
  stage.innerHTML=`
    <div class="card ${pile==="hard"?"hard":pile==="spelling"?"spelling":""}">
      <div class="eyebrow">${focus?"Pile: "+focus:pile==="hard"?"Important":pile==="spelling"?"Spelling":"Live"}${thTag}</div>
      ${current.taskType?`<div class="taskbox">${esc(current.taskType).replace(/\.\.\./g,'<span style="letter-spacing:.15em;opacity:.6">…</span>')}</div>`:""}
      <div class="prompt">${esc(current.prompt)}</div>
      ${revealed?`<div class="rule"></div><div class="answer">${esc(current.answer)}</div>`
               :`<div class="tapline">Think — then reveal</div>`}
    </div>
    ${revealed?`<div class="grade">
        <button class="g1" data-p="known">I knew it<small>retire this card</small></button>
        <button class="g2" data-p="live">Ask me again<small>stay in live pile</small></button>
        <button class="g3" data-p="hard">Didn't know<small>important pile</small></button>
        <button class="g4" data-p="spelling">Spelling<small>knew it, wrote it wrong</small></button>
      </div>
      <div class="dropline">
        <button class="act" data-act="edit">Correct this card</button>
        <button class="act danger" data-act="delete">Delete for good</button>
      </div>`
      :`<button class="reveal" id="rv">Show answer</button>`}`;
  if(!revealed)rv.onclick=()=>{revealed=true;render();};
  else stage.querySelectorAll(".grade button").forEach(b=>b.onclick=()=>grade(b.dataset.p));
}

function grade(p){current.pile=p;current.seen++;save();next();}
function drop(card){
  const key=card.prompt+"|||"+(card.theme||"");
  S.removed.push(key); S.cards=S.cards.filter(c=>c.id!==card.id);
  queue=queue.filter(c=>c.id!==card.id); save();toast("Deleted");next();
}

function editCard(card,after){
  const p=document.createElement("div");p.className="panel";
  p.innerHTML=`<div class="phead"><h2>Correct this card</h2><button class="close" id="x3">Cancel</button></div>
    <label>Prompt (Greek)</label><input id="ep" type="text" value="${esc(card.prompt)}">
    <label>Task / clue</label><input id="ett" type="text" value="${esc(card.taskType)}">
    <label>Answer</label><textarea id="ea">${esc(card.answer)}</textarea>
    <label>θέμα number</label><input id="eth" type="text" value="${card.theme||""}">
    <div class="row"><button class="primary" id="sv">Save</button><button id="cn">Cancel</button></div>`;
  document.body.appendChild(p);
  const back=()=>{p.remove();if(after)after();else render();};
  p.querySelector("#cn").onclick=back; p.querySelector("#x3").onclick=back;
  p.querySelector("#sv").onclick=()=>{
    const pr=p.querySelector("#ep").value.trim(),tt=p.querySelector("#ett").value.trim(),
          an=p.querySelector("#ea").value.trim(),th=parseInt(p.querySelector("#eth").value)||null;
    if(!pr||!an){toast("Prompt and answer are needed");return;}
    card.prompt=pr;card.taskType=tt;card.answer=an;card.theme=th;
    save();p.remove();toast("Card corrected");if(after)after();else render();
  };
}

document.addEventListener("keydown",e=>{
  if(document.querySelector(".panel"))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!revealed){revealed=true;render();}return;}
  if(!revealed)return;
  if(e.key==="1")grade("known");if(e.key==="2")grade("live");
  if(e.key==="3")grade("hard");if(e.key==="4")grade("spelling");
});

btnShuffle.onclick=()=>{build();revealed=false;render();toast("Reshuffled");};
btnRestore.onclick=()=>{
  let src=S.cards;
  if(themeFilter!==null)src=src.filter(c=>c.theme===themeFilter);
  src.forEach(c=>{if(c.pile==="known")c.pile="live";});
  save();build();revealed=false;render();
  toast(themeFilter!==null?"Known cards for θέμα "+themeFilter+" back in live":"All known cards back in live");
};
btnTheme.onclick=openThemePicker;
fLive.onclick=()=>setFocus("live"); fHard.onclick=()=>setFocus("hard");
fSpell.onclick=()=>setFocus("spelling"); fKnown.onclick=()=>setFocus("known");

btnAdd.onclick=()=>{
  const p=document.createElement("div");p.className="panel";
  p.innerHTML=`<div class="phead"><h2>Add a card</h2><button class="close" id="x2">Back</button></div>
    <label>Prompt (Greek)</label><input id="ap" type="text" placeholder="εγγυάται">
    <label>Task / clue</label><input id="att" type="text" placeholder="ίδιο νόημα">
    <label>Answer</label><textarea id="aa" placeholder="διασφαλίζει"></textarea>
    <label>θέμα number (optional)</label><input id="ath" type="text" placeholder="e.g. 42">
    <div class="row"><button class="primary" id="imp">Add card</button><button id="cl">Clear</button></div>`;
  document.body.appendChild(p);
  if(themeFilter!==null)p.querySelector("#ath").value=themeFilter;
  p.querySelector("#x2").onclick=()=>p.remove();
  p.querySelector("#cl").onclick=()=>{["ap","att","aa"].forEach(id=>p.querySelector("#"+id).value="");p.querySelector("#ap").focus();};
  p.querySelector("#imp").onclick=()=>{
    const pr=p.querySelector("#ap").value.trim(),tt=p.querySelector("#att").value.trim(),
          an=p.querySelector("#aa").value.trim(),th=parseInt(p.querySelector("#ath").value)||null;
    if(!pr||!an){toast("Prompt and answer are needed");return;}
    S.cards.push(mk(pr,tt,an,th)); save();
    p.querySelector("#ap").value="";p.querySelector("#aa").value="";p.querySelector("#ap").focus();
    toast("Card added");build();
  };
};

btnWords.onclick=()=>{
  let tab="live",q="";
  const p=document.createElement("div");p.className="panel";document.body.appendChild(p);
  const draw=()=>{
    let rows=S.cards.filter(c=>c.pile===tab);
    if(themeFilter!==null)rows=rows.filter(c=>c.theme===themeFilter);
    if(q)rows=rows.filter(c=>(c.prompt+" "+c.answer+" "+c.taskType).toLowerCase().includes(q.toLowerCase()));
    rows=rows.slice(0,400);
    p.innerHTML=`<div class="phead"><h2>Cards${themeFilter!==null?" · θέμα "+themeFilter:""}</h2><button class="close" id="x1">Back</button></div>
      <div class="tabs">
        <button data-t="live" aria-selected="${tab==="live"}">Live</button>
        <button data-t="hard" aria-selected="${tab==="hard"}">Important</button>
        <button data-t="spelling" aria-selected="${tab==="spelling"}">Spelling</button>
        <button data-t="known" aria-selected="${tab==="known"}">Known</button>
      </div>
      <input type="search" id="q" placeholder="Search" value="${esc(q)}">
      <div class="list">${rows.length?rows.map(c=>
        `<div><span class="g">${esc(c.prompt)}</span>
         <span class="th">${c.theme?"θ."+c.theme:""}</span>
         <button class="x pen" data-id="${c.id}">✎</button>
         <button class="x" data-id="${c.id}">✕</button></div>`).join("")
        :`<div class="empty">Nothing here.</div>`}</div>
      <div class="row"><button id="cl2">Back to practice</button></div>`;
    const bk=()=>{p.remove();if(!current)next();else render();};
    p.querySelector("#x1").onclick=bk; p.querySelector("#cl2").onclick=bk;
    p.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
    p.querySelectorAll(".pen").forEach(b=>b.onclick=ev=>{ev.stopPropagation();
      const card=S.cards.find(c=>c.id===b.dataset.id);if(card)editCard(card,draw);});
    p.querySelectorAll(".x:not(.pen)").forEach(b=>b.onclick=()=>{
      const card=S.cards.find(c=>c.id===b.dataset.id);if(card){drop(card);draw();}});
    const qi=p.querySelector("#q");
    qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;draw();
      p.querySelector("#q").focus();};
  };
  draw();
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
load();
</script>
</body>
</html>
